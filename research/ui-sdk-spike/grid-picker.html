<!doctype html><html><head><meta charset="utf-8"><script src="/node_modules/htmx.org/dist/htmx.min.js"></script><script type="module" src="/dist/all.js"></script>
<script src="/node_modules/axe-core/axe.min.js"></script>
<style>mero-asset-picker{grid-template-columns:repeat(3,60px)}</style></head><body>
<h1>POC</h1>
<mero-grid id="g" rows="3" cols="4" aria-label="Prices"><div role="row"><mero-grid-cell row="0" col="0">R0C0</mero-grid-cell><mero-grid-cell row="0" col="1">R0C1</mero-grid-cell><mero-grid-cell row="0" col="2">R0C2</mero-grid-cell><mero-grid-cell row="0" col="3">R0C3</mero-grid-cell></div><div role="row"><mero-grid-cell row="1" col="0">R1C0</mero-grid-cell><mero-grid-cell row="1" col="1">R1C1</mero-grid-cell><mero-grid-cell row="1" col="2">R1C2</mero-grid-cell><mero-grid-cell row="1" col="3">R1C3</mero-grid-cell></div><div role="row"><mero-grid-cell row="2" col="0">R2C0</mero-grid-cell><mero-grid-cell row="2" col="1">R2C1</mero-grid-cell><mero-grid-cell row="2" col="2">R2C2</mero-grid-cell><mero-grid-cell row="2" col="3">R2C3</mero-grid-cell></div></mero-grid>
<mero-asset-picker id="p" aria-label="Product images"><mero-asset value="a1"><img alt="Asset 1" width="40" height="40"></mero-asset><mero-asset value="a2"><img alt="Asset 2" width="40" height="40"></mero-asset><mero-asset value="a3"><img alt="Asset 3" width="40" height="40"></mero-asset><mero-asset value="a4"><img alt="Asset 4" width="40" height="40"></mero-asset><mero-asset value="a5"><img alt="Asset 5" width="40" height="40"></mero-asset><mero-asset value="a6"><img alt="Asset 6" width="40" height="40"></mero-asset></mero-asset-picker>
<script>window.ev=[];for(const t of ["mero:range","valuechange","orderchange","selectedchange"])document.addEventListener(t,e=>ev.push([t,e.detail?.value??e.detail]),true)</script>
</body></html>
