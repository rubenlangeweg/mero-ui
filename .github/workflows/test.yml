name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    name: Test (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      MERO_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
      - run: npm test
      - if: matrix.browser == 'chromium'
        run: npm run pack:ui
