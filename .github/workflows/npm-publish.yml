name: Publish to npm

# npm trusted publishing records the workflow that starts the run. release.yml
# calls this file, so the npmjs.com workflow filename is release.yml.
# A release event on this file would be a different filename and would not
# match that one publisher. This file is only a workflow_call.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Caller is the v* tag push, so github.ref is that tag.
      - name: Checkout the release tag
        uses: actions/checkout@v4

      # engines.node is ">=22". No .nvmrc, .node-version, volta, or packageManager.
      # Trusted publishing needs Node >= 22.14. Node 22's bundled npm is older
      # than 11.5.1, so the next step replaces it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install npm 11.21.3
        run: |
          npm install -g npm@11.21.3
          node --version
          npm --version
          node <<'EOF'
          const { execSync } = require("node:child_process");
          const node = process.versions.node.split(".").map(Number);
          if (node[0] < 22 || (node[0] === 22 && node[1] < 14)) {
            console.error(`Node ${process.version} is below 22.14.0`);
            process.exit(1);
          }
          const npm = execSync("npm --version", { encoding: "utf8" }).trim().split(".").map(Number);
          const min = [11, 5, 1];
          for (let i = 0; i < min.length; i++) {
            if (npm[i] > min[i]) break;
            if (npm[i] < min[i]) {
              console.error(`npm ${npm.join(".")} is below 11.5.1`);
              process.exit(1);
            }
          }
          EOF

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - run: npm ci
      # Site build (Cloudflare worker). package.json "files" keeps it out of the tarball.
      - run: npm run build
      - run: npm run pack:ui

      # OIDC from id-token: write. Provenance is added by the registry for this path.
      - name: Publish to npm
        run: npm publish --access public
